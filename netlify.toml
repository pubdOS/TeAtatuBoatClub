[build]
  command = "npm run build"
  publish = "dist"
  # Skip the build when nothing but markdown has changed SINCE THE LAST BUILD.
  # Netlify treats exit 0 from `ignore` as "nothing to build", and a production
  # deploy costs 15 credits, so a docs commit should not spend one.
  #
  # The baseline is CACHED_COMMIT_REF (the last commit Netlify actually built),
  # NOT HEAD^. Comparing against HEAD^ only asks "was the newest commit docs?",
  # so a push of code commits topped by a CONTEXT.md commit (a fast-forward
  # With NO build cache, Netlify sets CACHED_COMMIT_REF equal to COMMIT_REF (its
  # docs say so), so a commit is compared with itself and every change looks like
  # none: that cancelled a real Hart deploy on 2026-09-24. Equal refs therefore mean
  # "no baseline" and we build.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ':(exclude)*.md'"

# Old Wix addresses Google still lists (Search Console, 2026-10-18). Without
# these they fell through to the SPA fallback and showed "Page not found" with
# a 200, so Google kept them. Permanent, so their rankings move to the new pages.
# Must sit above the fallback: Netlify uses the first rule that matches.
[[redirects]]
  from = "/restaurant-bar"
  to = "/restaurant"
  status = 301

[[redirects]]
  from = "/club-bar"
  to = "/restaurant"
  status = 301

[[redirects]]
  from = "/bar"
  to = "/restaurant"
  status = 301

[[redirects]]
  from = "/copy-of-bar"
  to = "/restaurant"
  status = 301

[[redirects]]
  from = "/boating-facilities"
  to = "/facilities"
  status = 301

[[redirects]]
  from = "/copy-of-gallery"
  to = "/gallery"
  status = 301

[[redirects]]
  from = "/our-story"
  to = "/about"
  status = 301

[[redirects]]
  from = "/other-club-events"
  to = "/events"
  status = 301

[[redirects]]
  from = "/vacancies-1"
  to = "/contact"
  status = 301

# SPA fallback for any path without a prerendered file. Non-forced, so real
# prerendered pages are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Image CDN allowlist — lets /.netlify/images (src/lib/img.js) transform
# client-uploaded images stored on the Pubd Supabase bucket.
[images]
  remote_images = ["https://ckzojvudzugbdmdwlukw.supabase.co/storage/.*"]
